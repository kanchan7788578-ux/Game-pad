name: Build Phone & TV APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build TV Pad (Phone) and TV Arcade (TV) APKs
        run: gradle :app:assembleDebug :tv:assembleDebug --no-daemon

      - name: Verify & Package Installable APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TV-Pad-Phone.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk dist/TV-Arcade-TV.apk
          BT_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BT_DIR/apksigner" verify dist/TV-Pad-Phone.apk
          "$BT_DIR/apksigner" verify dist/TV-Arcade-TV.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-pad-and-arcade-apks
          path: dist/*.apk

      - name: Create GitHub Release with Both APKs
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TV Pad & TV Arcade APKs (v1.0.${{ github.run_number }})
          body: |
            ### ইনস্টল করার জন্য দুটি অফলাইন APK:
            - **TV-Pad-Phone.apk** — আপনার অ্যান্ড্রয়েড ফোনে ইনস্টল করুন (Bluetooth Gamepad & TV Remote)
            - **TV-Arcade-TV.apk** — আপনার অ্যান্ড্রয়েড টিভিতে ইনস্টল করুন (Space Striker, Neon Snake, Brick Breaker + Gamepad Tester)
          files: |
            dist/TV-Pad-Phone.apk
            dist/TV-Arcade-TV.apk
